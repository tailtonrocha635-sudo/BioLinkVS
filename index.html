<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Vorzix Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style id="app-css">
/* Layout: coluna única centralizada (logo, nome, bio, redes, botões em pílula). Tema escuro único, cores vindas do painel. */
:root{--bg:#000000;--fg:#ffffff;--btn:#9a9a9a;--btn-fg:#111111;--r:999px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
html,body{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
*{box-sizing:border-box}

.page{max-width:680px;margin:0 auto;padding-block:40px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center}
.logo{display:block;max-width:min(260px,72%);max-height:130px;object-fit:contain;margin-top:44px}
h1{margin:34px 0 0;font-size:clamp(26px,7.4vw,36px);font-weight:600;text-align:center;text-wrap:balance;letter-spacing:-.01em;line-height:1.15}
.bio{margin:10px 0 0;font-size:clamp(16px,4.6vw,20px);font-weight:500;line-height:1.45;text-align:center;white-space:pre-line;text-wrap:balance}
.socials{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.socials a{color:var(--fg);display:grid;place-items:center;width:46px;height:46px;border-radius:50%}
.socials a:hover{background:rgba(255,255,255,.1)}
.socials svg{width:28px;height:28px}
.links{list-style:none;padding:0;margin:40px 0 0;width:100%;display:flex;flex-direction:column;gap:14px}
.row{position:relative}
.link{display:flex;align-items:center;justify-content:center;min-height:68px;padding:12px 62px;background:var(--btn);color:var(--btn-fg);border-radius:var(--r);text-decoration:none;font-weight:500;font-size:17px;line-height:1.25;text-align:center;overflow-wrap:anywhere;transition:transform .15s ease}
a.link:hover{transform:scale(1.015)}
.link:focus-visible,.socials a:focus-visible,.dots:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.thumb{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:10px;object-fit:cover;pointer-events:none}
.dots{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--btn-fg);border-radius:50%;cursor:pointer;display:grid;place-items:center;opacity:.75}
.dots:hover{opacity:1}
.dots svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font:500 14px var(--font);z-index:90;box-shadow:0 6px 24px rgba(0,0,0,.4)}

.gate{position:fixed;inset:0;z-index:70;background:#0d0d0f;display:grid;place-items:center;padding:16px;font-family:var(--font);color:#f4f4f5}
.gbox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.gbox h2{margin:0 0 4px;font-size:20px;font-weight:600}
.gbox input{width:100%;background:#101013;color:#f4f4f5;border:1px solid #2c2c31;border-radius:10px;padding:12px;font:400 16px var(--font)}
.gbox input:focus-visible,.gbox button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.gerr{margin:0;min-height:18px;font-size:13px;color:#fca5a5}
.grow{display:flex;gap:10px;justify-content:flex-end}
.gbox button{font:500 14px var(--font);border-radius:10px;border:1px solid #2c2c31;padding:10px 16px;min-height:40px;cursor:pointer}
.gghost{background:transparent;color:#f4f4f5}
.gok{background:#fff;color:#0d0d0f;border-color:#fff}
/* ---------- Painel de administração ---------- */
.adm{--a-bg:#0d0d0f;--a-card:#18181b;--a-line:#2c2c31;--a-fg:#f4f4f5;--a-mut:#a1a1aa;--a-in:#101013;position:fixed;inset:0;z-index:60;overflow:auto;background:var(--a-bg);color:var(--a-fg);font-family:var(--font);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.adm-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--a-bg);border-bottom:1px solid var(--a-line);padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.adm::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--a-bg);z-index:4}
.adm h2{margin:0;font-size:18px;font-weight:600}
.adm-body{max-width:640px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px}
.adm section{display:flex;flex-direction:column;gap:12px}
.adm h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--a-mut)}
.adm .hint{margin:0;font-size:13px;color:var(--a-mut);line-height:1.5}
.card{background:var(--a-card);border:1px solid var(--a-line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;color:var(--a-mut);font-weight:500}
.adm input[type=text],.adm input[type=url],.adm textarea,.adm select{width:100%;min-width:0;background:var(--a-in);color:var(--a-fg);border:1px solid var(--a-line);border-radius:10px;padding:11px 12px;font:400 16px var(--font)}
.adm textarea{min-height:84px;resize:vertical;line-height:1.4}
.adm input:focus-visible,.adm textarea:focus-visible,.adm select:focus-visible,.adm button:focus-visible,.btn:focus-within{outline:2px solid #fff;outline-offset:2px}
.btn,.adm button{font:500 14px var(--font);border-radius:10px;border:1px solid var(--a-line);background:#26262b;color:var(--a-fg);padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn:hover,.adm button:hover{background:#303036}
.adm .primary{background:#fff;color:#0d0d0f;border-color:#fff}
.adm .primary:hover{background:#e4e4e7}
.adm .primary[disabled]{opacity:.5;cursor:default}
.adm .ghost{background:transparent}
.adm .danger{color:#fca5a5}
.adm .danger.armed{background:#7f1d1d;color:#fff;border-color:#7f1d1d}
.adm .small{padding:7px 11px;min-height:34px;font-size:13px}
.file{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.picker{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pv{width:72px;height:72px;border-radius:12px;background:var(--a-in);border:1px dashed var(--a-line);display:grid;place-items:center;overflow:hidden;flex:none;font-size:11px;color:var(--a-mut);text-align:center;padding:4px}
.pv img{width:100%;height:100%;object-fit:contain}
.pv.sq img{object-fit:cover}
.pv.wide{width:140px}
.pk-actions{display:flex;gap:8px;flex-wrap:wrap}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.lfields{display:flex;flex-direction:column;gap:10px;min-width:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts .sp{flex:1}
.hid{opacity:.55}
.srow{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center}
.colors{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.colors input[type=color]{width:100%;height:44px;padding:3px;border-radius:10px;border:1px solid var(--a-line);background:var(--a-in);cursor:pointer}
.sample{display:flex;align-items:center;justify-content:center;min-height:64px;padding:16px;border-radius:12px;font:500 16px var(--font)}
.sample .b{padding:14px 32px;text-align:center}
.adm-foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--a-bg);border-top:1px solid var(--a-line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;justify-content:flex-end}
.adm-foot .st{flex:1;font-size:13px;color:var(--a-mut);min-width:0}
@media (max-width:480px){.srow{grid-template-columns:1fr auto}.srow select{grid-column:1/-1}.lrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.link{transition:none}a.link:hover{transform:none}}
</style>

      Promise.all([window.claude.use('artifact'), window.claude.use('user')]).then(function (r) {
        artifactNS = r[0];
        var u = r[1];
        if (!u || !artifactNS) return;
        return u.canEdit().then(function (ok) {
          canEdit = !!ok;
        });
      }).catch(function () {});
    }
  } catch (e) {}
})();
